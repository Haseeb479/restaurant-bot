services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: foodio-app:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-foodio}"
      DB_USERNAME: "${DB_USERNAME:-foodio_user}"
      DB_PASSWORD: "${DB_PASSWORD:-foodio_secure_password_2026}"
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-foodio_redis_password_2026}"
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      EVOLUTION_BASE_URL: "http://evolution-api:8080"
      EVOLUTION_API_KEY: "${EVOLUTION_API_KEY:-foodio_evolution_secret_key_2026}"
      DISABLE_LEGACY_BOT: "true"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin12345678}"
    volumes:
      - app_storage:/var/www/html/storage
      - app_uploads:/var/www/html/public/uploads
    networks:
      - public_net
      - internal_net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  evolution-api:
    image: atendai/evolution-api:v2.2.3
    restart: unless-stopped
    # PRIVATELY DEPLOYED: NO host ports exposed! Reachable ONLY by services on internal_net.
    expose:
      - "8080"
    environment:
      SERVER_URL: "http://evolution-api:8080"
      AUTHENTICATION_API_KEY: "${EVOLUTION_API_KEY:-foodio_evolution_secret_key_2026}"
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      SERVER_TYPE: "http"
      DATABASE_PROVIDER: "local"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://:${REDIS_PASSWORD:-foodio_redis_password_2026}@redis:6379/1"
      CACHE_REDIS_PREFIX_KEY: "evolution"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CONFIG_SESSION_PHONE_CLIENT: "Foodio WhatsApp Bot"
      LOG_LEVEL: "WARN"
      LOG_COLOR: "false"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - internal_net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # PRIVATELY DEPLOYED: NO host ports exposed!
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-foodio}"
      MYSQL_USER: "${DB_USERNAME:-foodio_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-foodio_secure_password_2026}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-foodio_root_password_2026}"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME:-foodio_user}", "-p${DB_PASSWORD:-foodio_secure_password_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # PRIVATELY DEPLOYED: NO host ports exposed!
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-foodio_redis_password_2026}"]
    volumes:
      - redis_data:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-foodio_redis_password_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  public_net:
    driver: bridge
  internal_net:
    driver: bridge
    internal: true

volumes:
  app_storage:
  app_uploads:
  evolution_instances:
  evolution_store:
  mysql_data:
  redis_data:
