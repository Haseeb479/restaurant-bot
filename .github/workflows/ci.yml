name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  laravel-backend:
    name: Laravel Backend (PHPUnit)
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_KEY: base64:2D+1NkL3e6FgmmPHUg1fcrrXS3GQ8okt1YwvOqT+KWc=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      ADMIN_PASSWORD: testpassword123
      BOT_INTERNAL_TOKEN: 02946be11eb016a014ef2c16a254b0bc8d62c141e52c1525002d96a484cda4d5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, sqlite3, bcmath, fileinfo, filter, hash
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer Dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Generate App Key
        run: php artisan key:generate

      - name: Run PHP Syntax / Lint Checks
        run: |
          php -l app/Models/Restaurant.php
          php -l app/Models/Order.php
          php -l app/Models/Customer.php
          php -l app/Http/Controllers/DashboardController.php
          php -l app/Http/Controllers/AdminController.php
          php -l app/Http/Controllers/RestaurantController.php
          php -l app/Support/WebhookUrlValidator.php
          php -l app/Support/CsvSanitizer.php
          php -l app/Support/BotControlClient.php

      - name: Run PHPUnit Test Suite
        run: php artisan test

  whatsapp-bot:
    name: WhatsApp Bot (Node.js Test Suite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: npm install

      - name: Run Bot Test Suite
        run: npm test

